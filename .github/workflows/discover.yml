name: Discover

# Weekly diff of BYMA's web app against this library. Opens (or updates) an
# issue listing endpoints to add, remove or fix; closes it when clean.
on:
  schedule:
    # Mondays 15:00 UTC = 12:00 ART, market open.
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    name: Web app diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Diff web app vs library
        id: diff
        run: |
          set +e
          go run ./scripts/discover -probe > report.md
          code=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = nothing to do, 1 = findings, anything else = the tool broke
          [ "$code" -le 1 ]

      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "BYMA API: endpoints to add, remove or fix"
        run: |
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          {
            cat report.md
            echo
            echo "Generated by the [Discover workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). See docs/MAINTAINING.md."
          } > body.md
          if [ "${{ steps.diff.outputs.code }}" = "1" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing left to do as of this run."
          fi
